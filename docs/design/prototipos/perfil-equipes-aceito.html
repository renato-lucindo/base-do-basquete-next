<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8fb" />
    <title>Serra Basquete · Perfil da equipe</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #075fca;
        --ink: #172b45;
        --muted: #53657a;
        --line: #dbe3ed;
        --soft: #eef5ff;
        --bg: #f6f8fb;
        --green: #008817;
        --red: #d92d20;
        --radius: 5px;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        font-size: 15px;
        line-height: 1.5;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      summary {
        touch-action: manipulation;
      }
      button,
      select,
      summary {
        cursor: pointer;
      }
      button {
        background: #fff;
        border: 1px solid #7b8796;
        border-radius: var(--radius);
        min-height: 44px;
        padding: 8px 13px;
      }
      button:hover {
        background: var(--soft);
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      input:focus-visible,
      summary:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        text-wrap: balance;
      }
      h1 {
        font-size: 29px;
        letter-spacing: -0.7px;
        line-height: 1.2;
      }
      h2 {
        font-size: 17px;
        line-height: 1.4;
      }
      h3 {
        font-size: 15px;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      button svg,
      a svg {
        display: inline-block;
        vertical-align: middle;
      }
      small,
      .muted {
        color: var(--muted);
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .skip {
        position: fixed;
        top: -80px;
        left: 15px;
        z-index: 50;
        background: #fff;
        padding: 12px;
      }
      .skip:focus {
        top: 10px;
      }
      .site-header {
        height: 65px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .header-inner {
        height: 100%;
        max-width: 1480px;
        padding: 0 28px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 16px;
        font-weight: 750;
        white-space: nowrap;
      }
      .brandmark {
        display: grid;
        place-items: center;
        background: var(--blue);
        width: 31px;
        height: 31px;
        border-radius: 7px;
        color: #fff;
        font-weight: 800;
        font-size: 22px;
      }
      .prototype {
        font-size: 12px;
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 9px;
      }
      .shell {
        max-width: 1480px;
        margin: auto;
        padding: 0 28px 28px;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 51px;
        font-size: 13px;
        color: var(--muted);
        flex-wrap: wrap;
        padding: 12px 0;
      }
      .breadcrumb .sep {
        color: #92a0b1;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 305px;
        column-gap: 24px;
        align-items: start;
      }
      .identity {
        background: #fff;
        border: 1px solid var(--line);
        border-top: 3px solid var(--blue);
        border-radius: 5px 5px 0 0;
        padding: 23px 24px 22px;
        min-width: 0;
      }
      .identity-top {
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .crest {
        width: 75px;
        height: 85px;
        flex-shrink: 0;
      }
      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .identity-name {
        min-width: 0;
      }
      .identity .sub {
        font-size: 14px;
        color: var(--muted);
        margin-top: 5px;
      }
      .identity .meta {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-size: 13px;
      }
      .identity .context {
        margin-top: 17px;
        padding-top: 15px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .context-label {
        font-weight: 650;
      }
      .context-label small {
        display: block;
        font-weight: 400;
        margin-top: 2px;
      }
      .text-link {
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        gap: 5px;
        align-items: center;
        min-height: 36px;
      }
      .scope-tag {
        display: inline-block;
        border: 1px solid #c6d7ed;
        background: var(--soft);
        color: #174b88;
        border-radius: 4px;
        font-size: 11px;
        padding: 2px 7px;
        white-space: nowrap;
      }
      .workspace {
        grid-column: 1;
        grid-row: 2;
        min-width: 0;
        background: #fff;
        border: 1px solid var(--line);
        border-top: 0;
        border-radius: 0 0 5px 5px;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        background: #fff;
        padding: 0 16px;
        gap: 5px;
        overflow-x: auto;
        scrollbar-width: thin;
      }
      .tab {
        border: 0;
        border-radius: 0;
        background: none;
        white-space: nowrap;
        min-height: 53px;
        padding: 11px 15px;
        border-bottom: 3px solid transparent;
        font-size: 14px;
        font-weight: 550;
      }
      .tab[aria-selected="true"] {
        color: var(--blue);
        background: var(--soft);
        border-bottom-color: var(--blue);
        font-weight: 700;
      }
      .panel {
        padding: 23px 24px 20px;
        min-height: 380px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
        flex-wrap: wrap;
      }
      .section-head .subtitle {
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }
      .section {
        margin-top: 26px;
      }
      .section:first-child {
        margin-top: 0;
      }
      .tools {
        display: flex;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-bottom: 17px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        min-width: 105px;
      }
      .field select,
      .field input {
        width: 100%;
        min-height: 41px;
        padding: 7px 32px 7px 10px;
        border: 1px solid #7b8796;
        border-radius: 4px;
        background-color: #fff;
        font-weight: 400;
        font-size: 13px;
      }
      .field input {
        padding-right: 10px;
      }
      .field.wide {
        min-width: 185px;
        flex: 1;
      }
      .field.grow {
        flex: 1;
      }
      .field.compact {
        min-width: 90px;
      }
      .head-year {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        font-weight: 500;
      }
      .head-year select {
        min-height: 40px;
        border: 1px solid #7b8796;
        border-radius: 4px;
        background: #fff;
        padding: 6px 25px 6px 9px;
        color: var(--ink);
        font: inherit;
      }
      .count {
        font-size: 12px;
        color: var(--muted);
        font-weight: 400;
      }
      .scroll {
        overflow-x: auto;
        max-width: 100%;
        scrollbar-width: thin;
        border-bottom: 1px solid var(--line);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      thead {
        background: #e9eff7;
      }
      th {
        text-align: right;
        font-size: 12px;
        white-space: nowrap;
        font-weight: 650;
        padding: 11px 9px;
        border-block: 1px solid #ccd7e5;
      }
      th:first-child {
        border-left: 1px solid #ccd7e5;
      }
      th:last-child {
        border-right: 1px solid #ccd7e5;
      }
      td {
        padding: 13px 9px;
        border-bottom: 1px solid var(--line);
        text-align: right;
        white-space: nowrap;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #f8faff;
      }
      .left {
        text-align: left;
      }
      .center {
        text-align: center;
      }
      .name-cell {
        white-space: normal;
        min-width: 162px;
        max-width: 240px;
        text-align: left;
      }
      .name-cell a {
        font-weight: 650;
      }
      .cell-sub {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
        font-weight: 400;
      }
      .cell-sub .division {
        color: #65748a;
      }
      .position {
        font-weight: 700;
        color: var(--ink);
        font-size: 14px;
      }
      .stage {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .status {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 11px;
        white-space: nowrap;
        font-weight: 500;
      }
      .status:before {
        content: "";
        height: 7px;
        width: 7px;
        border-radius: 50%;
        background: var(--status);
      }
      .status.in_progress {
        --status: #dc6b0b;
        color: #9b4b04;
      }
      .status.completed {
        --status: #008817;
        color: #006c13;
      }
      .status.planned {
        --status: #2674ce;
        color: #1859a3;
      }
      .status.cancelled {
        --status: #d92d20;
        color: #b4271a;
      }
      .recent-results {
        display: flex;
        gap: 1px;
        justify-content: center;
      }
      .result {
        border: 0;
        background: none;
        padding: 0;
        width: 26px;
        min-height: 32px;
        display: grid;
        place-items: center;
        border-radius: 4px;
        position: relative;
      }
      .result span {
        display: grid;
        place-items: center;
        width: 19px;
        height: 19px;
        border-radius: 50%;
        color: #fff;
        font-size: 13px;
        font-weight: 750;
        line-height: 1;
      }
      .result.win span {
        background: var(--green);
      }
      .result.loss span {
        background: var(--red);
      }
      .result.latest span {
        outline: 1px solid currentColor;
        outline-offset: 2px;
      }
      .result.latest.win {
        color: var(--green);
      }
      .result.latest.loss {
        color: var(--red);
      }
      .result:hover {
        background: #e6edf5;
      }
      .legend {
        margin-top: 23px;
        padding-top: 15px;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      .legend h2 {
        min-height: 32px;
        display: list-item;
        font-weight: 600;
      }
      .legend dl {
        display: flex;
        gap: 8px 20px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .legend dl div {
        display: flex;
        gap: 5px;
      }
      .legend dt {
        font-weight: 650;
      }
      .legend dd {
        margin: 0;
      }
      .empty {
        padding: 35px 15px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      .empty strong {
        display: block;
        margin-bottom: 7px;
        color: var(--ink);
      }
      .empty button {
        margin-top: 14px;
      }
      .honors {
        grid-column: 2;
        grid-row: 1 / span 2;
        background: #fff;
        border: 1px solid var(--line);
        border-top: 3px solid var(--blue);
        border-radius: 5px;
        padding: 20px 19px;
        min-width: 0;
      }
      .honors-title {
        display: flex;
        gap: 9px;
        align-items: center;
        margin-bottom: 16px;
      }
      .honors-title svg {
        color: var(--blue);
      }
      .honors h2 {
        font-size: 16px;
      }
      .honors .tools {
        gap: 8px;
        margin-bottom: 18px;
      }
      .honors .field {
        min-width: 0;
        flex: 1;
      }
      .honors .field select {
        font-size: 12px;
        padding-left: 8px;
        padding-right: 20px;
      }
      .honors-context {
        background: var(--soft);
        border: 1px solid #d5e4f7;
        border-radius: 4px;
        padding: 10px 12px;
        margin-bottom: 18px;
        font-size: 13px;
        font-weight: 650;
      }
      .honors-context small {
        display: block;
        font-weight: 400;
        font-size: 11px;
        margin-top: 3px;
      }
      .award-section {
        display: grid;
        grid-template-columns: 29px minmax(0, 1fr);
        gap: 8px;
        padding-top: 17px;
        margin-top: 17px;
        border-top: 1px solid var(--line);
      }
      .award-section.first {
        margin-top: 0;
        padding-top: 0;
        border: 0;
      }
      .medal {
        display: grid;
        place-items: center;
        width: 28px;
        height: 31px;
        border-radius: 4px;
      }
      .medal.gold {
        color: #956a0a;
        background: #fff5d8;
      }
      .medal.silver {
        color: #65758c;
        background: #eef1f5;
      }
      .medal.bronze {
        color: #995c37;
        background: #fcf0e8;
      }
      .award-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        font-weight: 650;
        font-size: 13px;
        margin: 2px 0 7px;
      }
      .award-total {
        font-size: 11px;
        color: var(--muted);
        font-weight: 400;
      }
      .award details {
        border-bottom: 1px solid #e8edf4;
        padding: 4px 0;
      }
      .award details:last-child {
        border: 0;
      }
      .award summary {
        font-size: 12px;
        min-height: 33px;
        line-height: 1.5;
        padding: 7px 0;
      }
      .award summary .number {
        font-size: 11px;
        color: var(--muted);
      }
      .award ul {
        list-style: none;
        padding: 0 0 5px 11px;
        margin: 0;
        border-left: 2px solid #e3eaf3;
      }
      .award li {
        font-size: 11px;
        margin: 7px 0;
        line-height: 1.5;
      }
      .award li a {
        display: block;
      }
      .award-footer {
        font-size: 11px;
        color: var(--muted);
        margin-top: 19px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .recent-table th:first-child,
      .recent-table td:first-child {
        text-align: left;
        width: 75px;
        padding-left: 13px;
      }
      .recent-table td:nth-child(2),
      .recent-table th:nth-child(2) {
        text-align: left;
      }
      .recent-table td {
        padding: 13px;
      }
      .date-day {
        font-weight: 600;
        font-size: 13px;
      }
      .date-year {
        font-size: 11px;
        color: var(--muted);
        display: block;
      }
      .match-link {
        color: var(--ink);
        display: block;
        min-width: 245px;
      }
      .match-link:hover {
        text-decoration: none;
        color: var(--blue);
      }
      .matchline {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        font-weight: 600;
      }
      .matchscore {
        color: #1557a4;
        font-weight: 750;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .matchline .opp {
        font-weight: 450;
      }
      .match-context {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .result-label {
        font-size: 11px;
        font-weight: 600;
        display: inline-flex;
        gap: 5px;
        align-items: center;
      }
      .result-label.won {
        color: #007414;
      }
      .result-label.lost {
        color: #bf2a1d;
      }
      .result-label.upcoming {
        color: var(--muted);
      }
      .link-footer {
        text-align: right;
        margin-top: 12px;
      }
      .summary-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border-block: 1px solid var(--line);
        margin-bottom: 25px;
      }
      .summary-stat {
        padding: 15px 10px;
        border-right: 1px solid var(--line);
      }
      .summary-stat:first-child {
        padding-left: 0;
      }
      .summary-stat:last-child {
        border: 0;
      }
      .summary-stat dt {
        font-size: 12px;
        color: var(--muted);
      }
      .summary-stat dd {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin: 4px 0 0;
        font-variant-numeric: tabular-nums;
      }
      .summary-stat dd span {
        font-size: 12px;
        letter-spacing: 0;
        font-weight: 400;
        color: var(--muted);
        margin-left: 5px;
      }
      .phase-box {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: center;
        margin-bottom: 20px;
      }
      .phase-box .position {
        font-size: 22px;
      }
      .phase-box small {
        display: block;
        font-size: 12px;
      }
      .segments {
        display: flex;
        border: 1px solid #7b8796;
        border-radius: 4px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .segments button {
        min-height: 37px;
        border: 0;
        border-radius: 0;
        font-size: 12px;
        padding: 7px 12px;
      }
      .segments button[aria-pressed="true"] {
        color: var(--blue);
        background: var(--soft);
        font-weight: 650;
      }
      .segments button + button {
        border-left: 1px solid var(--line);
      }
      .roster-layout {
        display: grid;
        grid-template-columns: 215px minmax(0, 1fr);
        border: 1px solid var(--line);
        border-radius: 4px;
        min-width: 0;
      }
      .roster-list {
        background: #f8faff;
        border-right: 1px solid var(--line);
        padding: 8px;
        max-height: 510px;
        overflow: auto;
      }
      .roster-item {
        display: block;
        padding: 12px 10px;
        border-radius: 4px;
        color: var(--ink);
        font-size: 12px;
        border: 1px solid transparent;
        margin-bottom: 4px;
      }
      .roster-item strong {
        display: block;
        font-size: 13px;
      }
      .roster-item small {
        display: block;
        font-size: 11px;
        margin-top: 3px;
      }
      .roster-item:hover {
        text-decoration: none;
        background: #edf3fb;
      }
      .roster-item.active {
        background: #eaf2ff;
        border-color: #bad1ee;
        color: #0752a7;
      }
      .roster-body {
        padding: 17px;
        min-width: 0;
      }
      .roster-body h3 {
        margin-bottom: 4px;
      }
      .roster-body .scroll {
        margin-top: 15px;
      }
      .avatar {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #edf2f8;
        color: #53657a;
        font-size: 10px;
        margin-right: 8px;
        vertical-align: middle;
        font-weight: 650;
      }
      .roster-note {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .search {
        position: relative;
        min-width: 165px;
      }
      .mobile-roster-back {
        display: none;
      }
      .footer {
        max-width: 1480px;
        margin: auto;
        padding: 22px 28px 28px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 11px;
        border-top: 1px solid var(--line);
      }
      .tooltip {
        position: fixed;
        z-index: 100;
        pointer-events: none;
        background: #172b45;
        color: #fff;
        font-size: 12px;
        padding: 8px 11px;
        border-radius: 4px;
        box-shadow: 0 4px 15px #172b4520;
        max-width: calc(100vw - 20px);
      }
      .tooltip[hidden] {
        display: none;
      }
      dialog {
        border: 1px solid var(--line);

        const focusedTab = document.activeElement?.dataset.tab;
        const focusedSort = document.activeElement?.dataset.playersort;
        state = readState();
        const p = selectedP(state.pid),
          contextual = state.mode === "disputa";
        const tabs = contextual
          ? [
              ["visao-geral", "Visão geral"],
              ["jogadores", "Jogadores"],
              ["jogos", "Jogos"],
            ]
          : [
              ["visao-geral", "Visão geral"],
              ["competicoes", "Competições"],
              ["elencos", "Elencos"],
              ["jogos", "Jogos"],
              ["estatisticas", "Estatísticas"],
            ];
        const body =
          state.tab === "visao-geral"
            ? overview()
            : state.tab === "competicoes"
              ? competitionHistory()
              : state.tab === "estatisticas"
                ? statistics()
                : state.tab === "jogos"
                  ? games()
                  : roster();
        document.title =
          TEAM +
          (contextual
            ? " · " + p.competition + " " + p.year
            : " · Perfil da equipe");
        document.querySelector("#main").innerHTML =
          `<nav class="breadcrumb" aria-label="Localização"><a href="${href({ mode: "geral", tab: "visao-geral", game: "", athlete: "" })}">Equipes</a><span class="sep">/</span>${contextual ? `<a href="${href({ mode: "geral", tab: "visao-geral" })}">${TEAM}</a><span class="sep">/</span><span>${p.competition} ${p.year} · ${p.category}</span>` : `<span>${TEAM}</span>`}</nav><div class="layout"><header class="identity"><div class="identity-top">${crest}<div class="identity-name"><p class="eyebrow">${contextual ? "Equipe na disputa" : "Perfil da equipe"}</p><h1>${TEAM}</h1><p class="sub">Associação Atlética da Serra</p><div class="meta">${icon("pin", 13)} Serra, ES <span aria-hidden="true">·</span> <span class="scope-tag">${contextual ? `${p.category} · ${p.gender}` : "Todas as categorias"}</span></div></div></div>${contextual ? `<div class="context"><div class="context-label">${p.competition} · ${p.year}<small>${miniContext(p)}</small></div><a class="text-link" href="${href({ mode: "geral", tab: "visao-geral" })}">${icon("back", 14)} Ver perfil geral</a></div>` : ""}</header>${honors()}<div class="workspace"><div class="tabs" role="tablist" aria-label="Seções do perfil">${tabs.map(([id, label]) => `<button class="tab" id="tab-${id}" role="tab" aria-selected="${state.tab === id}" aria-controls="panel" tabindex="${state.tab === id ? 0 : -1}" data-tab="${id}">${label}</button>`).join("")}</div><div id="panel" class="panel" role="tabpanel" aria-labelledby="tab-${state.tab}" tabindex="0">${body}</div></div></div>`;
        if (focus) document.querySelector(`[data-filter="${focus}"]`)?.focus();
        if (focusedTab)
          document.querySelector(`[data-tab="${state.tab}"]`)?.focus();
        if (focusedSort)
          document.querySelector(`[data-playersort="${focusedSort}"]`)?.focus();
        document.getElementById("announcement").textContent =
          `${contextual ? p.competition + " " + p.category : "Perfil geral"}. ${tabs.find((t) => t[0] === state.tab)[1]}.`;
        document.getElementById("tooltip").hidden = true;
        renderDialog();
      }
      function renderDialog() {
        const dialog = document.getElementById("detail"),
          g = GAMES.find((g) => g.id === state.game);
        let content = "";
        if (g) {
          const p = selectedP(g.pid);
          content = `<div class="dialog-head"><h2 id="dialog-title">${g.played ? "Resultado do jogo" : "Jogo agendado"}</h2><button data-close aria-label="Fechar detalhe">×</button></div><div class="dialog-body"><p class="dialog-caption">${p.competition} · ${context(p)}</p><div class="dialog-score"><strong>${g.home ? TEAM : g.opponent}</strong><div class="big-score">${g.home ? fmt(g.pf) + " × " + fmt(g.pa) : fmt(g.pa) + " × " + fmt(g.pf)}</div><strong>${g.home ? g.opponent : TEAM}</strong></div><p class="dialog-caption">${date(g.date, true)} · ${g.time} · ${g.venue}</p>${g.played ? `<div class="summary-strip" style="margin-top:22px"><div class="summary-stat"><dt>Resultado</dt><dd style="font-size:18px">${g.won ? "Vitória" : "Derrota"}</dd></div><div class="summary-stat"><dt>2P</dt><dd>${g.two}</dd></div><div class="summary-stat"><dt>3P</dt><dd>${g.three}</dd></div><div class="summary-stat"><dt>LL</dt><dd>${g.free}</dd></div></div>` : ""}<a class="text-link" href="${toDispute(p)}">Ver equipe nesta disputa ${icon("arrow", 15)}</a></div>`;
        } else if (state.athlete !== "") {
          const p =
            selectedP(state.mode === "disputa" ? state.pid : state.roster) ||
            PARTICIPATIONS.find((p) => String(p.year) === state.rosterYear);
          const a = rosterPlayers(p).find(
            (a) => String(a.id) === state.athlete,
          );
          if (a)
            content = `<div class="dialog-head"><h2 id="dialog-title">${a.name}</h2><button data-close aria-label="Fechar detalhe">×</button></div><div class="dialog-body"><p>${TEAM} · #${a.jersey}</p><p class="muted" style="margin-top:5px">${context(p)} · ${p.competition}</p><dl class="summary-strip" style="margin-top:20px"><div class="summary-stat"><dt>Jogos</dt><dd>${a.games}</dd></div><div class="summary-stat"><dt>PTS / jogo</dt><dd>${fmt(a.points)}</dd></div></dl><p class="muted">Participação ilustrativa neste protótipo.</p></div>`;
        }
        if (content) {
          if (dialog.innerHTML !== content) dialog.innerHTML = content;
          if (!dialog.open) {
            dialog.dataset.returnGame = g?.id || "";
            dialog.showModal();
          }
        } else if (dialog.open) {
          const returnGame = dialog.dataset.returnGame;
          dialog.close();
          if (returnGame)
            document
              .querySelector(`[data-game="${returnGame}"] .match-link`)
              ?.focus();
        }
      }
      document.addEventListener("change", (e) => {
        const key = e.target.dataset.filter;
        if (!key) return;
        const patch = {
          [key]: key === "year" ? Number(e.target.value) : e.target.value,
        };
        if (key === "rosterYear") {
          patch.roster = "";
          patch.rosterSearch = "";
        }
        navigate(patch);
      });
      let searchTimer;
      document.addEventListener("input", (e) => {
        const key = e.target.dataset.search;
        if (!key) return;
        const value = e.target.value,
          start = e.target.selectionStart;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          navigate({ [key]: value }, true);
          const target = document.querySelector(`[data-search="${key}"]`);
          target?.focus();
          target?.setSelectionRange(start, start);
        }, 180);
      });
      document.addEventListener("click", (e) => {
        const tab = e.target.closest("[data-tab]");
        if (tab) {
          navigate({ tab: tab.dataset.tab, game: "", athlete: "" });
          return;
        }
        const mode = e.target.closest("[data-mode]");
        if (mode) {
          navigate({ statsMode: mode.dataset.mode });
          return;
        }
        if (e.target.closest("[data-close]")) {
          navigate({ game: "", athlete: "" });
          return;
        }
        const tip = e.target.closest("[data-tooltip]");
        if (tip) {
          showTip(tip);
          return;
        }
        const a = e.target.closest('a[href^="#"]');
        if (a && !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey) {
          if (a.getAttribute("href") === "#main") return;
          document.querySelector("#tooltip").hidden = true;
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape")
          document.querySelector("#tooltip").hidden = true;
        const tab = e.target.closest("[data-tab]");
        if (!tab || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key))
          return;
        e.preventDefault();
        const tabs = [...document.querySelectorAll("[data-tab]")],
          i = tabs.indexOf(tab),
          next =
            e.key === "Home"
              ? 0
              : e.key === "End"
                ? tabs.length - 1
                : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                  tabs.length;
        const key = tabs[next].dataset.tab;
        navigate({ tab: key });
        setTimeout(
          () => document.querySelector(`[data-tab="${key}"]`)?.focus(),
          0,
        );
      });
      function showTip(target) {
        const box = document.querySelector("#tooltip");
        box.textContent = target.dataset.tooltip;
        box.hidden = false;
        const r = target.getBoundingClientRect();
        const width = box.getBoundingClientRect().width;
        box.style.left =
          Math.max(
            10,
            Math.min(
              window.innerWidth - width - 10,
              r.left + r.width / 2 - width / 2,
            ),
          ) + "px";
        box.style.top =
          (r.top > 65 ? r.top - box.offsetHeight - 8 : r.bottom + 8) + "px";
      }
      document.addEventListener("mouseover", (e) => {
        const target = e.target.closest("[data-tooltip]");
        if (target) showTip(target);
      });
      document.addEventListener("mouseout", (e) => {
        if (e.target.closest("[data-tooltip]"))
          document.querySelector("#tooltip").hidden = true;
      });
      document.addEventListener("focusin", (e) => {
        if (e.target.matches("[data-tooltip]")) showTip(e.target);
      });
      document.addEventListener(
        "focusout",
        () => (document.querySelector("#tooltip").hidden = true),
      );
      window.addEventListener(
        "scroll",
        () => (document.querySelector("#tooltip").hidden = true),
        { passive: true },
      );
      document.getElementById("detail").addEventListener("cancel", (e) => {
        e.preventDefault();
        navigate({ game: "", athlete: "" });
      });

      document.addEventListener("click", (event) => {
        const mode = event.target.closest("[data-playermode]");
        if (mode) {
          navigate({ playerMode: mode.dataset.playermode });
          return;
        }
        const preset = event.target.closest("[data-playerpreset]");
        if (preset) {
          navigate({
            playerPreset: preset.dataset.playerpreset,
            playerColumns: null,
          });
          return;
        }
        const sort = event.target.closest("[data-playersort]");
        if (sort) {
          navigate({
            playerSort: sort.dataset.playersort,
            playerDirection:
              state.playerSort === sort.dataset.playersort &&
              state.playerDirection === "desc"
                ? "asc"
                : "desc",
          });
          return;
        }
      });
      document.addEventListener("change", (event) => {
        const box = event.target.closest("[data-playercolumn]");
        if (!box) return;
        const p =
          selectedP(state.mode === "disputa" ? state.pid : state.roster) ||
          PARTICIPATIONS.find((p) => String(p.year) === state.rosterYear);
        const current = visiblePlayerKeys(p),
          next = box.checked
            ? [...current, box.dataset.playercolumn]
            : current.filter((k) => k !== box.dataset.playercolumn);
        const open = document.querySelector(".column-picker")?.open;
        navigate(
          {
            playerColumns: sourcePlayerKeys(p)
              .filter((k) => next.includes(k))
              .join(","),
          },
          true,
        );
        const picker = document.querySelector(".column-picker");
        if (picker && open) {
          picker.open = true;
          picker
            .querySelector(
              '[data-playercolumn="' + box.dataset.playercolumn + '"]',
            )
            ?.focus();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          const picker = document.querySelector(".column-picker[open]");
          if (picker) {
            picker.open = false;
            picker.querySelector("summary").focus();
          }
        }
      });

      window.addEventListener("hashchange", () => {
        render();
      });
      render();
    </script>
  </body>
</html>
