name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require main as PR base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: test "$PR_BASE" = main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Detect verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            if grep -Ev '^(|docs/.*\.(md|png|jpg|jpeg|svg)|historico/documentacao/.*\.(md|png|jpg|jpeg|svg)|README\.md|CONTRIBUTING\.md|AGENTS\.md|\.github/PULL_REQUEST_TEMPLATE\.md)$' <<< "$changed_files" > /dev/null; then
              echo 'code=true' >> "$GITHUB_OUTPUT"
            else
              echo 'code=false' >> "$GITHUB_OUTPUT"
            fi
          fi
      - run: npm ci --ignore-scripts
      - name: Secret scanner regression checks
        run: node --test tests/check-secrets.test.mjs
      - name: Documentation checks
        if: steps.scope.outputs.code == 'false'
        run: npm run format:check && node scripts/check-secrets.mjs --source-only
      - run: python especificacao/BASE-DO-BASQUETE-ARQUITETURA-20261022/verificar-pacote.py
        if: steps.scope.outputs.code == 'true'
      - name: Validate vendored UI/UX skill
        if: steps.scope.outputs.code == 'true'
        run: python3 -m unittest discover -s .agents/skills/ui-ux-pro-max/scripts/tests -q
      - run: npm run gate
        if: steps.scope.outputs.code == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.code == 'true'
      - run: npm run design:verify
        if: steps.scope.outputs.code == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.code == 'true'
        with:
          name: design-publico-${{ github.sha }}
          path: |
            docs/design/.preview-artifacts/
            docs/design/prototipos/sumula/*.png
            docs/design/prototipos/sumula/verification*.json
            docs/design/prototipos/estatisticas/react-prototype/*.png
            docs/design/prototipos/estatisticas/react-prototype/verification.json
          include-hidden-files: true
      - run: npm run test:e2e
        if: steps.scope.outputs.code == 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-uiux-desktop-${{ github.sha }}
          path: .preview-artifacts/*after*.png
          if-no-files-found: warn
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.code == 'true'
        with:
          name: prototipo-${{ github.sha }}
          path: dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: test-results
